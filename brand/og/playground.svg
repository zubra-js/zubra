<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Try Zubra in your browser.">
  <title>Try Zubra in your browser.</title>
  <defs>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="13" height="26" fill="#232738"/><rect x="13" width="13" height="26" fill="#8b95ff"/></pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.8"><stop offset="0" stop-color="#4f5df5" stop-opacity="0.28"/><stop offset="1" stop-color="#4f5df5" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#14161F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(66 52) scale(0.6)"><path fill="#F2F3F8" d="M10 15 a5 5 0 0 1 5 -5 H81 a5 5 0 0 1 5 5 V27 H10 Z"/><path fill="#F2F3F8" d="M10 69 H86 V81 a5 5 0 0 1 -5 5 H15 a5 5 0 0 1 -5 -5 Z"/><path fill="#8b95ff" d="M54 27 H86 L42 69 H10 Z"/></g>
  <text x="136" y="95" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#F2F3F8">zubra</text>
  <text x="72" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#8b95ff">PLAYGROUND</text>
  <text x="72" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#F2F3F8" letter-spacing="-1">Try Zubra in</text>
  <text x="72" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#F2F3F8" letter-spacing="-1">your browser.</text>
  <text x="72" y="374" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9aa0b4">Edit a .zb file, see the element it</text>
  <text x="72" y="414" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9aa0b4">compiles to. Nothing to install.</text>
  <text x="72" y="568" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="22" fill="#9aa0b4">zubra-js.github.io/zubra/playground</text>
  <g>
    <rect x="640" y="150" width="496" height="340" rx="16" fill="#0d0f15" stroke="#2c3040" stroke-width="2"/>
    <line x1="940" y1="150" x2="940" y2="490" stroke="#2c3040" stroke-width="2"/>
    <text x="664" y="186" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="15" fill="#9aa0b4">component.zb</text>
    <text x="664" y="232" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#b8bdd0">&lt;</tspan><tspan fill="#ff8fb3">copy-button</tspan><tspan fill="#f5b97a"> text label</tspan><tspan fill="#b8bdd0">=</tspan><tspan fill="#7ee0a6">"Copy"</tspan><tspan fill="#b8bdd0">&gt;</tspan></text>
  <text x="664" y="260" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#b8bdd0">  &lt;</tspan><tspan fill="#ff8fb3">button</tspan><tspan fill="#f5b97a"> onclick</tspan><tspan fill="#b8bdd0">={</tspan><tspan fill="#7cc4ff">copy</tspan><tspan fill="#b8bdd0">}&gt;</tspan></text>
  <text x="664" y="288" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#b8bdd0">    {</tspan><tspan fill="#7cc4ff">label</tspan><tspan fill="#b8bdd0">}</tspan></text>
  <text x="664" y="316" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#b8bdd0">  &lt;/</tspan><tspan fill="#ff8fb3">button</tspan><tspan fill="#b8bdd0">&gt;</tspan></text>
  <text x="664" y="344" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#b8bdd0">&lt;/</tspan><tspan fill="#ff8fb3">copy-button</tspan><tspan fill="#b8bdd0">&gt;</tspan></text>
    <text x="964" y="186" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="15" fill="#9aa0b4">preview</text>
    <rect x="964" y="226" width="148" height="64" rx="12" fill="#4f5df5"/>
    <text x="1038" y="267" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff">Copy</text>
    <text x="964" y="334" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#9aa0b4">&lt;copy-button&gt;</text>
    <text x="964" y="360" font-family="'DejaVu Sans Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#9aa0b4">a standard element</text>
  </g>
  <rect y="604" width="1200" height="26" fill="url(#stripes)"/>
</svg>
