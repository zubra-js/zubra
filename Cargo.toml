[package]
name = "zubra"
version = "6.0.4"
edition = "2021"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/zubra-js/zubra"
description = "Compiler for Zubra web components: HTML-first components to server-rendered HTML and hydrating custom elements"
homepage = "https://github.com/zubra-js/zubra"
readme = "README.md"
keywords = ["web-components", "compiler", "custom-elements", "ssr", "html"]
categories = ["compilers", "web-programming", "command-line-utilities"]
# The integration tests also exercise the repository's component corpus and golden fixtures.
include = [
    "/src/**/*", "/tests/**/*", "/Cargo.toml", "/README.md", "/LICENSE",
    "/examples/header.*", "/**/*.zb", "/registry/components/**/*",
    "/runtime/test/browser/fixtures/**/*",
]

[[bin]]
name = "zubra"
path = "src/main.rs"

[dependencies]
html-escape = "0.2"
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_codegen = "0.157"
oxc_mangler = "0.157"
oxc_parser = "0.157"
oxc_regular_expression = "0.157"
oxc_semantic = "0.157"
oxc_span = "0.157"
oxc_str = "0.157"
oxc_syntax = "0.157"
regress = { version = "0.12", features = ["utf16"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
smallvec = "1.16"

[workspace]
members = [".", "wasm", "sync-server", "macros"]
resolver = "2"
